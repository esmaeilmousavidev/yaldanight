<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کارت پستال شب یلدا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg1:#1a0b2e;--bg2:#3b0a2a;--gold:#f6d48b;--red:#d6213f;--text:#fff4e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg1) 70%);color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.card{position:relative;width:100%;max-width:560px;padding:34px 22px 28px;border-radius:28px;text-align:center;background:linear-gradient(160deg,rgba(120,20,60,.55),rgba(40,10,70,.75));border:2px solid var(--gold);box-shadow:0 0 0 8px rgba(246,212,139,.12),0 25px 60px rgba(0,0,0,.6),inset 0 0 60px rgba(214,33,63,.2);overflow:hidden}
.card::before{content:"";position:absolute;inset:10px;border:1px dashed rgba(246,212,139,.5);border-radius:20px;pointer-events:none}
.moon{position:absolute;top:18px;left:22px;width:44px;height:44px;border-radius:50%;box-shadow:inset -12px 0 0 0 var(--gold);transform:rotate(-20deg);filter:drop-shadow(0 0 8px var(--gold))}
h1{margin:6px 0 4px;font-weight:800;font-size:clamp(34px,8vw,52px);color:var(--gold);text-shadow:0 0 18px rgba(246,212,139,.5)}
.sub{margin:0 0 14px;font-weight:300;font-size:16px;opacity:.9}
.fruits{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:6px 0 10px}
.fruits svg{filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.pom{animation:float 4s ease-in-out infinite}
.pom2{animation:float 4s ease-in-out -2s infinite}
.mel{animation:float 5s ease-in-out -1s infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.msg{font-weight:500;line-height:2;font-size:17px;margin:8px 8px 18px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 4px}
.box{background:rgba(0,0,0,.35);border:1px solid rgba(246,212,139,.45);border-radius:16px;padding:12px 4px}
.num{font-size:clamp(26px,7vw,38px);font-weight:800;color:var(--gold);line-height:1.2}
.lbl{font-size:13px;opacity:.85}
.note{margin-top:14px;font-size:14px;opacity:.8;min-height:22px}
.seed{position:absolute;top:-20px;width:8px;height:12px;background:var(--red);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:.8;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(700px) rotate(360deg);opacity:0}}
.bookbtn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:10px 22px;font:500 16px 'Vazirmatn',Tahoma,sans-serif;color:var(--gold);background:rgba(246,212,139,.1);border:1.5px solid var(--gold);border-radius:999px;cursor:pointer;animation:glow 2.4s ease-in-out infinite;transition:transform .2s}
.bookbtn:hover{transform:scale(1.06)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(246,212,139,.45)}50%{box-shadow:0 0 18px 4px rgba(246,212,139,.35)}}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,3,20,.8);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .4s}
.modal.show{opacity:1;pointer-events:auto}
.fal{position:relative;width:100%;max-width:440px;perspective:1200px;transform:scale(.7);transition:transform .5s cubic-bezier(.2,1.2,.4,1)}
.modal.show .fal{transform:scale(1)}
.page{padding:26px 20px 20px;text-align:center;color:#3a1a0e;background:linear-gradient(160deg,#f7e8c8,#e9cf9c);border:3px solid #a8772a;border-radius:14px 22px 22px 14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ptitle{font-weight:800;font-size:22px;color:#8a1030;margin-bottom:10px}
.v{font-weight:500;font-size:clamp(17px,4.6vw,21px);line-height:2.1;opacity:0}
.tabir{margin-top:12px;padding-top:12px;border-top:1px dashed #a8772a;font-size:15px;line-height:1.9;opacity:0}
.fal.open .v,.fal.open .tabir{animation:rise .8s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.acts{display:flex;gap:10px;justify-content:center;margin-top:16px}
.acts button{font:500 15px 'Vazirmatn',Tahoma,sans-serif;padding:8px 18px;border-radius:999px;border:1.5px solid #8a1030;cursor:pointer;background:#8a1030;color:#fff4e6}
.acts button.alt{background:transparent;color:#8a1030}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--gold);font-weight:500;font-size:18px;background:linear-gradient(160deg,#7a0f2e,#3b0a2a);border:3px solid var(--gold);border-radius:14px 22px 22px 14px;transform-origin:right center;backface-visibility:hidden;transition:transform 1.1s ease-in-out}
.fal.open .cover{transform:rotateY(150deg);pointer-events:none}
.moonglow{position:absolute;left:-46px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(246,212,139,.6),rgba(246,212,139,.15) 45%,transparent 70%);pointer-events:none;opacity:1;transition:opacity 1.2s ease;animation:breathe 3.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.15)}}
.moon{transition:filter 1.2s ease,opacity 1.2s ease}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(5,0,15,.42);opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.card.dim::after{opacity:1}
.card.dim .moonglow{opacity:0}
.card.dim .moon{filter:none;opacity:.5}
.moonbtn svg{transition:transform .8s ease,opacity .8s ease}
.card.dim .moonbtn svg{transform:rotate(-35deg) scale(.85);opacity:.6}
.bookbtn{margin-inline:5px}
.stagewrap{position:relative;margin:6px 0 10px}
.stage{position:absolute;left:50%;top:0;margin-left:-250px;width:500px;height:170px;transform-origin:50% 0}
.stage .fruits{position:absolute;left:0;right:0;bottom:0;margin:0}
.ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.moon{cursor:pointer;z-index:3;transition:filter 1.2s ease,opacity 1.2s ease,transform .25s ease;-webkit-tap-highlight-color:transparent}
.moon::before{content:"";position:absolute;inset:-12px;border-radius:50%}
.moon:hover{transform:rotate(-20deg) scale(1.12)}
.moon:active{transform:rotate(-20deg) scale(.9)}
.moon:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<canvas id="fw" aria-hidden="true"></canvas>
<main class="card" id="card">
  <div class="moonglow"></div><div class="moon" id="moonEl" role="button" tabindex="0" title="برای کم و زیاد کردن نور ماه بزنید" aria-label="کم و زیاد کردن نور ماه"></div>
  <h1>شب یلدا مبارک</h1>
  <p class="sub">بلندترین شب سال، گرم‌ترین دورهمی</p>

  <div class="stagewrap" id="stagewrap"><div class="stage" id="stage"><div class="fruits">
    <svg class="pom" width="96" height="104" viewBox="0 0 100 108" aria-label="انار">
      <defs><radialGradient id="pg" cx="35%" cy="30%"><stop offset="0" stop-color="#ff5a72"/><stop offset=".6" stop-color="#c4122f"/><stop offset="1" stop-color="#7a0a1f"/></radialGradient></defs>
      <path d="M38 22l-6-14 12 8 6-12 6 12 12-8-6 14z" fill="#a50f28"/>
      <circle cx="50" cy="62" r="40" fill="url(#pg)"/>
      <ellipse cx="36" cy="44" rx="10" ry="16" fill="#fff" opacity=".22" transform="rotate(25 36 44)"/>
      <path d="M50 22v6" stroke="#5c0715" stroke-width="3"/>
    </svg>
    <svg class="mel" width="150" height="100" viewBox="0 0 160 100" aria-label="هندوانه">
      <path d="M5 8a75 75 0 0 0 150 0z" fill="#1f7a3a"/>
      <path d="M13 8a67 67 0 0 0 134 0z" fill="#d7f3c8"/>
      <path d="M19 8a61 61 0 0 0 122 0z" fill="#ef3550"/>
      <g fill="#2b0d12">
        <ellipse cx="55" cy="30" rx="3" ry="5" transform="rotate(-20 55 30)"/>
        <ellipse cx="80" cy="42" rx="3" ry="5"/>
        <ellipse cx="105" cy="30" rx="3" ry="5" transform="rotate(20 105 30)"/>
        <ellipse cx="68" cy="58" rx="3" ry="5" transform="rotate(-15 68 58)"/>
        <ellipse cx="94" cy="60" rx="3" ry="5" transform="rotate(15 94 60)"/>
        <ellipse cx="40" cy="18" rx="2.5" ry="4.5" transform="rotate(-35 40 18)"/>
        <ellipse cx="120" cy="18" rx="2.5" ry="4.5" transform="rotate(35 120 18)"/>
      </g>
    </svg>
    <svg class="pom2" width="76" height="84" viewBox="0 0 100 108" aria-label="انار">
      <path d="M38 22l-6-14 12 8 6-12 6 12 12-8-6 14z" fill="#a50f28"/>
      <circle cx="50" cy="62" r="40" fill="url(#pg)"/>
      <ellipse cx="36" cy="44" rx="10" ry="16" fill="#fff" opacity=".22" transform="rotate(25 36 44)"/>
    </svg>
  </div>

  <svg class="ov" width="500" height="170" viewBox="0 0 500 170" aria-hidden="true">
      <rect x="165" y="0" width="170" height="5" rx="2.5" fill="#d9b87a"/>
      <circle cx="190" cy="5" r="3.5" fill="#f6d48b"/><circle cx="310" cy="5" r="3.5" fill="#f6d48b"/>
      <g id="gL"><line id="rL" stroke="#e8c98a" stroke-width="2.5" stroke-linecap="round"/><g id="pL"></g></g>
      <g id="gR"><line id="rR" stroke="#e8c98a" stroke-width="2.5" stroke-linecap="round"/><g id="pR"></g></g>
    </svg>
  </div></div>

  <p class="msg">شب چله‌تان پر از شادی، سفره‌تان رنگین از انار و هندوانه و دل‌هایتان گرم از مهر عزیزان.</p>

  <div class="count" aria-live="polite">
    <div class="box"><div class="num" id="d">۰</div><div class="lbl">روز</div></div>
    <div class="box"><div class="num" id="h">۰</div><div class="lbl">ساعت</div></div>
    <div class="box"><div class="num" id="m">۰</div><div class="lbl">دقیقه</div></div>
    <div class="box"><div class="num" id="s">۰</div><div class="lbl">ثانیه</div></div>
  </div>
  <div class="note" id="note"></div>
  <button class="bookbtn" id="falBtn" type="button">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v13c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v13c2.5-1.5 5.5-1.5 8 0z"/></svg>
    فال حافظ
  </button>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="فال حافظ">
  <div class="fal" id="fal">
    <div class="page">
      <div class="ptitle">فال حافظ</div>
      <div id="verse"></div>
      <div class="tabir" id="tabir"></div>
      <div class="acts"><button type="button" id="again">فال دوباره</button><button type="button" class="alt" id="close">بستن</button></div>
    </div>
    <div class="cover" aria-hidden="true">
      <svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v13c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v13c2.5-1.5 5.5-1.5 8 0z"/></svg>
      <span>نیت کنید…</span>
    </div>
  </div>
</div>
<script>
(function(){
  var fa=function(n){return String(n).replace(/\d/g,function(x){return '۰۱۲۳۴۵۶۷۸۹'[x]})};
  // stars
  var st=document.getElementById('stars');
  for(var i=0;i<70;i++){var s=document.createElement('div');s.className='star';
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*3)+'s';s.style.transform='scale('+(0.6+Math.random()*1.2)+')';st.appendChild(s);}
  // falling pomegranate seeds
  var card=document.getElementById('card');
  for(var j=0;j<14;j++){var e=document.createElement('div');e.className='seed';
    e.style.left=Math.random()*100+'%';e.style.animationDuration=(6+Math.random()*6)+'s';
    e.style.animationDelay=(-Math.random()*8)+'s';card.appendChild(e);}
  // countdown: evening of 30 Azar (Dec 21)
  function target(){
    var now=new Date(),y=now.getFullYear();
    var t=new Date(y,11,21,18,0,0);
    if(now>new Date(t.getTime()+12*3600e3)) t=new Date(y+1,11,21,18,0,0);
    return t;
  }
  function tick(){
    var t=target(),now=new Date(),diff=t-now;
    if(diff<=0){
      ['d','h','m','s'].forEach(function(k){document.getElementById(k).textContent=fa(0)});
      document.getElementById('note').textContent='امشب شب یلداست! شب خوبی داشته باشید 🍉';
      return;
    }
    var d=Math.floor(diff/864e5),h=Math.floor(diff%864e5/36e5),m=Math.floor(diff%36e5/6e4),s=Math.floor(diff%6e4/1e3);
    document.getElementById('d').textContent=fa(d);
    document.getElementById('h').textContent=fa(h);
    document.getElementById('m').textContent=fa(m);
    document.getElementById('s').textContent=fa(s);
    document.getElementById('note').textContent='تا شب یلدا (۳۰ آذر، ساعت ۱۸)';
  }
  tick();setInterval(tick,1000);

  // کم و زیاد کردن نور ماه
  var dimmed=false,moonLbl={};
  document.getElementById('moonEl').addEventListener('click',function(){
    dimmed=!dimmed;card.classList.toggle('dim',dimmed);
    moonLbl.textContent=dimmed?'نور ماه: کم':'نور ماه: زیاد';
  });

  // مقیاس صحنه برای صفحه‌های کوچک
  var wrap=document.getElementById('stagewrap'),stage=document.getElementById('stage');
  function fit(){var sc=Math.min(1,wrap.clientWidth/500);stage.style.transform='scale('+sc+')';wrap.style.height=(170*sc)+'px'}
  fit();window.addEventListener('resize',fit);

  // فشفشه
  var cv=document.getElementById('fw'),cx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),W=0,H=0,rockets=[],sparks=[];
  function sizeFw(){W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  sizeFw();window.addEventListener('resize',sizeFw);
  var pal=[['#ffd36b','#fff1c1'],['#ff3b5c','#ff9aa9'],['#ff5fa2','#ffd0e6'],['#52e08a','#c9ffe0'],['#ffffff','#cfd8ff'],['#ff7a33','#ffd2a8']];
  function launch(x,ty){
    var nf=50+Math.random()*20;
    rockets.push({x:x,y:H,tx:x+(Math.random()-.5)*60,ty:ty,vy:-(H-ty)/nf,c:pal[Math.floor(Math.random()*pal.length)]});
  }
  function burst(x,y,c){
    var n=70+Math.floor(Math.random()*40),ring=Math.random()<.35;
    for(var i=0;i<n;i++){
      var a=Math.PI*2*i/n+Math.random()*.1,sp=ring?4.2:1.5+Math.random()*4.2;
      sparks.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:.008+Math.random()*.012,c:c[Math.random()<.7?0:1]});
    }
  }
  function loopFw(){
    cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(0,0,W,H);
    cx.globalCompositeOperation='lighter';
    for(var i=rockets.length-1;i>=0;i--){
      var r=rockets[i];r.y+=r.vy;r.x+=(r.tx-r.x)*.03;
      cx.fillStyle=r.c[1];cx.beginPath();cx.arc(r.x,r.y,2.2,0,6.283);cx.fill();
      if(r.y<=r.ty){burst(r.x,r.y,r.c);rockets.splice(i,1)}
    }
    for(var j=sparks.length-1;j>=0;j--){
      var s=sparks[j];s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy=s.vy*.985+.055;s.life-=s.dec;
      if(s.life<=0){sparks.splice(j,1);continue}
      cx.globalAlpha=s.life;cx.fillStyle=s.c;cx.beginPath();cx.arc(s.x,s.y,1.8,0,6.283);cx.fill();
    }
    cx.globalAlpha=1;
    requestAnimationFrame(loopFw);
  }
  function autoFw(){
    if(!document.hidden)launch(W*(.12+Math.random()*.76),H*(.12+Math.random()*.33));
    setTimeout(autoFw,900+Math.random()*1400);
  }
  if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){loopFw();setTimeout(autoFw,600)}
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest&&e.target.closest('button,.modal,.moon'))return;
    launch(e.clientX,Math.max(40,e.clientY));
  });
  var moonEl=document.getElementById('moonEl');
  
  moonEl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();moonEl.click()}});

  // انیمیشن تاب‌بازی دو نفر با طناب
  var PS=function(c){return `<line x1='-2' y1='0' x2='-11' y2='21' stroke='#f2c9a0' stroke-width='3.5' stroke-linecap='round'/><line x1='2' y1='0' x2='11' y2='21' stroke='#f2c9a0' stroke-width='3.5' stroke-linecap='round'/><rect x='-10' y='18' width='20' height='22' rx='6' fill='${c}'/><line x1='-4' y1='40' x2='-5' y2='54' stroke='#3b2a4a' stroke-width='4.5' stroke-linecap='round'/><line x1='4' y1='40' x2='5' y2='54' stroke='#3b2a4a' stroke-width='4.5' stroke-linecap='round'/><circle cx='0' cy='10' r='6.5' fill='#f2c9a0'/><path d='M-6.5 9.5a6.5 6.5 0 0 1 13 0z' fill='#3b2a4a'/><circle cx='-2.4' cy='11.5' r='1' fill='#3b2a4a'/><circle cx='2.4' cy='11.5' r='1' fill='#3b2a4a'/>`};
  var L=100,G=168,T=11,T1=0.8,PER=1.5,TR=T1+2.25*PER,FL=1.1,LD=1.0,D=Math.PI/180;
  function sm(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
  var people=[
    {k:'L',ax:190,s:-1,lx:48,d:1.2,c:'#d6213f'},
    {k:'R',ax:310,s:1,lx:452,d:1.95,c:'#2f9e57'}
  ];
  people.forEach(function(q){
    q.grp=document.getElementById('g'+q.k);q.rope=document.getElementById('r'+q.k);q.p=document.getElementById('p'+q.k);
    q.p.innerHTML=PS(q.c);q.rope.setAttribute('x1',q.ax);q.rope.setAttribute('y1',5);
  });
  function frame(now){
    var t0=now/1000;
    people.forEach(function(q){
      var t=t0<q.d?0:((t0-q.d)%T);
      var gop=Math.max(0,Math.min(1,t/0.5,(T-t)/0.8));
      var Cx,Cy,rot,rx,ry;
      if(t<TR){
        var amp=t<T1?0:10+42*sm((t-T1)/(TR-T1));
        var th=t<T1?q.s*3*Math.sin(t*4):q.s*amp*Math.sin(2*Math.PI*(t-T1)/PER);
        var r=th*D;
        Cx=q.ax+(L+28)*Math.sin(r);Cy=5+(L+28)*Math.cos(r);rot=-th;
        rx=q.ax+L*Math.sin(r);ry=5+L*Math.cos(r);
      }else{
        var thr=q.s*52,rr=thr*D,tt=t-TR;
        var x0=q.ax+(L+28)*Math.sin(rr),y0=5+(L+28)*Math.cos(rr),r0=-thr,x1=q.lx,y1=G-28;
        if(tt<FL){
          var u=tt/FL;
          Cx=x0+(x1-x0)*u;Cy=y0+(y1-y0)*u-180*u*(1-u);rot=r0+(q.s*720-r0)*u;
        }else{
          var w=(tt-FL)/LD;
          Cx=x1;Cy=y1-(w<1?16*Math.abs(Math.sin(w*Math.PI*2.5))*Math.exp(-2.2*w):0);
          rot=5*Math.sin((tt-FL)*7)*sm(w);
        }
        var th2=thr*Math.cos(2*Math.PI*tt/1.5)*Math.exp(-1.6*tt)*D;
        rx=q.ax+L*Math.sin(th2);ry=5+L*Math.cos(th2);
      }
      q.rope.setAttribute('x2',rx);q.rope.setAttribute('y2',ry);
      q.p.setAttribute('transform','translate('+Cx+' '+Cy+') rotate('+rot+') translate(0 -28)');
      q.grp.style.opacity=gop;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // فال حافظ
  var fals=[
    {b:['الا یا ایها الساقی ادر کأساً و ناولها','که عشق آسان نمود اول ولی افتاد مشکل‌ها'],t:'آغاز کار شاید دشوار باشد، اما با صبر و پشتکار راه هموار می‌شود. شجاعت شروع را از دست ندهید.'},
    {b:['اگر آن ترک شیرازی به دست آرد دل ما را','به خال هندویش بخشم سمرقند و بخارا را'],t:'دل‌بستگی و محبت ارزشی بالاتر از ثروت دارد. به آنچه دوست دارید وفادار بمانید.'},
    {b:['دوش دیدم که ملایک در میخانه زدند','گل آدم بسرشتند و به پیمانه زدند'],t:'لطف و عنایتی در راه است. به خود و سرنوشتتان اعتماد کنید.'},
    {b:['یوسف گم‌گشته بازآید به کنعان غم مخور','کلبهٔ احزان شود روزی گلستان غم مخور'],t:'گمشده‌ای بازمی‌گردد و روزهای سخت به پایان می‌رسد. غصه نخورید.'},
    {b:['سال‌ها دل طلب جام جم از ما می‌کرد','وآنچه خود داشت ز بیگانه تمنا می‌کرد'],t:'آنچه می‌جویید در درون خودتان است. به توانایی‌هایتان باور داشته باشید.'},
    {b:['دل می‌رود ز دستم صاحب‌دلان خدا را','دردا که راز پنهان خواهد شد آشکارا'],t:'رازی در دل دارید که بهتر است با دوستی قابل‌اعتماد در میان بگذارید؛ آرامش در همدلی است.'},
    {b:['صبا به لطف بگو آن غزال رعنا را','که سر به کوه و بیابان تو داده‌ای ما را'],t:'پیامی خوش یا دیدار یاری در راه است. با مهربانی و ملایمت پیش بروید.'}
  ];
  var modal=document.getElementById('modal'),fal=document.getElementById('fal'),last=-1,timer;
  function fill(){
    var i;do{i=Math.floor(Math.random()*fals.length)}while(i===last&&fals.length>1);last=i;
    var f=fals[i],v=document.getElementById('verse');v.innerHTML='';
    f.b.forEach(function(line,k){var d=document.createElement('div');d.className='v';d.textContent=line;d.style.animationDelay=(1+k*0.7)+'s';v.appendChild(d)});
    var tb=document.getElementById('tabir');tb.textContent='تعبیر: '+f.t;tb.style.animationDelay='2.6s';
  }
  function draw(delay){
    clearTimeout(timer);fal.classList.remove('open');
    timer=setTimeout(function(){fill();fal.classList.add('open')},delay);
  }
  function openFal(){modal.classList.add('show');draw(800)}
  function closeFal(){clearTimeout(timer);modal.classList.remove('show');fal.classList.remove('open')}
  document.getElementById('falBtn').addEventListener('click',openFal);
  document.getElementById('again').addEventListener('click',function(){draw(700)});
  document.getElementById('close').addEventListener('click',closeFal);
  modal.addEventListener('click',function(e){if(e.target===modal)closeFal()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeFal()});
})();
</script>
</body>
</html>
